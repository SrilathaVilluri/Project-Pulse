<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Pulse - PM Health Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>📊 Project Pulse</h1>
        <p>Project Health Assessment Dashboard</p>
    </header>

    <div class="card">

        <h2>Project Inputs</h2>

        <div class="form-grid">

            <div>
                <label>Planned Completion (%)</label>
                <input type="number" id="plannedCompletion" value="50">
            </div>

            <div>
                <label>Actual Completion (%)</label>
                <input type="number" id="actualCompletion" value="35">
            </div>

            <div>
                <label>Planned Budget (₹)</label>
                <input type="number" id="plannedBudget" value="1000000">
            </div>

            <div>
                <label>Actual Spend (₹)</label>
                <input type="number" id="actualSpend" value="1200000">
            </div>

            <div>
                <label>Open High Risks</label>
                <input type="number" id="highRisks" value="5">
            </div>

            <div>
                <label>Open Medium Risks</label>
                <input type="number" id="mediumRisks" value="8">
            </div>

            <div>
                <label>Stakeholder Satisfaction (1-5)</label>
                <input type="number" id="stakeholderScore" min="1" max="5" value="2">
            </div>

            <div>
                <label>Resource Utilization (%)</label>
                <input type="number" id="resourceUtilization" value="110">
            </div>

        </div>

        <button onclick="calculateHealth()">Analyze Project</button>

    </div>

    <div id="results" class="card hidden">

        <h2>Project Health Report</h2>

        <div class="result-grid">
            <div class="metric">
                <h3>Health Score</h3>
                <span id="healthScore">0</span>
            </div>

            <div class="metric">
                <h3>Status</h3>
                <span id="statusBadge">-</span>
            </div>
        </div>

        <h3>Root Causes</h3>
        <ul id="rootCauses"></ul>

        <h3>Recovery Recommendations</h3>
        <ul id="recommendations"></ul>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
